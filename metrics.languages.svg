<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 390" width="480" height="390">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="480" height="390" rx="16" fill="#0C0C12" stroke="#242432" stroke-width="1.5" />

  <!-- Languages Activity Header -->
  <g transform="translate(20, 26)">
    <text x="0" y="14" class="sans" font-size="15" font-weight="700" fill="#10B981">🈷️ Languages Activity &amp; Coding Habits</text>
    <text x="440" y="14" text-anchor="end" class="mono" font-size="9.5" fill="#71717A">lowlighter/metrics</text>
  </g>
  <line x1="20" y1="52" x2="460" y2="52" stroke="#1E1E2A" stroke-width="1" />

  <!-- Language Progress Bar -->
  <g transform="translate(20, 68)">
    <text x="0" y="0" class="sans" font-size="12.5" font-weight="700" fill="#FAFAFA">Most Used Languages across Public &amp; Private Repos</text>
    <g transform="translate(0, 12)">
      <rect x="0" y="0" width="145" height="10" rx="4" fill="#DEA584" />
      <rect x="147" y="0" width="115" height="10" rx="0" fill="#3178C6" />
      <rect x="264" y="0" width="95" height="10" rx="0" fill="#F1E05A" />
      <rect x="361" y="0" width="52" height="10" rx="0" fill="#3572A5" />
      <rect x="415" y="0" width="25" height="10" rx="4" fill="#10B981" />
    </g>

    <!-- Language Legend Grid -->
    <g transform="translate(0, 42)" class="mono" font-size="11" fill="#A1A1AA">
      <circle cx="6" cy="-4" r="5" fill="#DEA584" />
      <text x="18" y="0"><tspan fill="#FAFAFA" font-weight="600">Rust</tspan> (SnapKit Native) — 33%</text>

      <circle cx="236" cy="-4" r="5" fill="#3178C6" />
      <text x="248" y="0"><tspan fill="#FAFAFA" font-weight="600">TypeScript</tspan> (MDX/Next) — 26%</text>

      <circle cx="6" cy="22" r="5" fill="#F1E05A" />
      <text x="18" y="26"><tspan fill="#FAFAFA" font-weight="600">JavaScript</tspan> (React/Node) — 22%</text>

      <circle cx="236" cy="22" r="5" fill="#3572A5" />
      <text x="248" y="26"><tspan fill="#FAFAFA" font-weight="600">Python</tspan> (AI &amp; Linters) — 12%</text>

      <circle cx="6" cy="48" r="5" fill="#10B981" />
      <text x="18" y="52"><tspan fill="#FAFAFA" font-weight="600">MDX / Docusaurus 3</tspan> — 7%</text>

      <circle cx="236" cy="48" r="5" fill="#38BDF8" />
      <text x="248" y="52"><tspan fill="#FAFAFA" font-weight="600">SQL &amp; OpenAPI 3.1</tspan> — Verified</text>
    </g>
  </g>

  <line x1="20" y1="184" x2="460" y2="184" stroke="#1E1E2A" stroke-width="1" />

  <!-- Coding Habits & Follow-up -->
  <g transform="translate(20, 206)" class="sans" font-size="12" fill="#A1A1AA">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#10B981">💡 Coding Habits &amp; Follow-up</text>
    <text x="0" y="24">● Indentation style: <tspan fill="#FAFAFA" font-weight="600">Spaces (2 &amp; 4 spaces)</tspan></text>
    <text x="0" y="44">● Most active hours: <tspan fill="#FAFAFA" font-weight="600">10:00 – 22:00 (America/Sao_Paulo)</tspan></text>
    <text x="0" y="64">● Workflow discipline: <tspan fill="#34D399" font-weight="600">Automated pre-publish style &amp; link linting</tspan></text>
  </g>

  <line x1="20" y1="290" x2="460" y2="290" stroke="#1E1E2A" stroke-width="1" />

  <!-- Achievements Strip -->
  <g transform="translate(20, 312)">
    <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#10B981">🏆 GitHub &amp; Engineering Achievements</text>
    <g transform="translate(0, 14)" class="mono" font-size="10.5">
      <rect x="0" y="0" width="102" height="32" rx="8" fill="#14141E" stroke="#2A2A3A" />
      <text x="51" y="20" text-anchor="middle" fill="#34D399">🌐 Polyglot</text>

      <rect x="112" y="0" width="106" height="32" rx="8" fill="#14141E" stroke="#2A2A3A" />
      <text x="165" y="20" text-anchor="middle" fill="#38BDF8">🚀 Deployer</text>

      <rect x="228" y="0" width="110" height="32" rx="8" fill="#14141E" stroke="#2A2A3A" />
      <text x="283" y="20" text-anchor="middle" fill="#C4B5FD">📦 Maintainer</text>

      <rect x="348" y="0" width="92" height="32" rx="8" fill="#14141E" stroke="#2A2A3A" />
      <text x="394" y="20" text-anchor="middle" fill="#FACC15">⚡ Automator</text>
    </g>
  </g>
</svg>
