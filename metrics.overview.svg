<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 390" width="480" height="390">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="480" height="390" rx="16" fill="#0C0C12" stroke="#242432" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(20, 26)">
    <circle cx="14" cy="10" r="12" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="1.5" />
    <text x="14" y="14" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#10B981">MS</text>
    <text x="36" y="15" class="sans" font-size="16" font-weight="700" fill="#10B981">Michel Silveira (MichelGSS)</text>
    <text x="440" y="14" text-anchor="end" class="mono" font-size="9.5" fill="#71717A">lowlighter/metrics</text>
  </g>
  <line x1="20" y1="52" x2="460" y2="52" stroke="#1E1E2A" stroke-width="1" />

  <!-- Activity & Community Grid -->
  <g transform="translate(20, 74)" class="sans" font-size="12" fill="#A1A1AA">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#10B981">⚡ Activity &amp; Repositories</text>
    <text x="0" y="24">● <tspan fill="#FAFAFA" font-weight="600">7</tspan> Repositories (<tspan fill="#FAFAFA" font-weight="600">6</tspan> Public · <tspan fill="#FAFAFA" font-weight="600">1</tspan> Private)</text>
    <text x="0" y="44">● <tspan fill="#34D399" font-weight="600">+48,200</tspan> / <tspan fill="#F43F5E" font-weight="600">-9,400</tspan> Lines of code authored</text>
    <text x="0" y="64">● Active workflows: <tspan fill="#FAFAFA" font-weight="600">Git CI/CD, Docs Linting, AI Agents</tspan></text>

    <text x="250" y="0" font-size="13" font-weight="700" fill="#10B981">🌐 Community &amp; Profile</text>
    <text x="250" y="24">● Available for remote opportunities</text>
    <text x="250" y="44">● <tspan fill="#FAFAFA" font-weight="600">6 ★</tspan> Stargazers · <tspan fill="#FAFAFA" font-weight="600">5</tspan> Followers</text>
    <text x="250" y="64">● Preferred license: <tspan fill="#FAFAFA" font-weight="600">MIT Open Source</tspan></text>
  </g>

  <line x1="20" y1="158" x2="460" y2="158" stroke="#1E1E2A" stroke-width="1" />

  <!-- Isometric Commit Calendar Section -->
  <g transform="translate(20, 180)">
    <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#10B981">📅 Isometric Contributions Calendar (Half-Year)</text>

    <!-- 3D Isometric Cube Grid Illustration -->
    <g transform="translate(20, 26)">
      <!-- Base Platform -->
      <polygon points="160,15 300,85 160,155 20,85" fill="#12121C" stroke="#262636" stroke-width="1" />
      <!-- Grid lines -->
      <line x1="55" y1="67" x2="195" y2="137" stroke="#1C1C2B" stroke-width="1" />
      <line x1="90" y1="50" x2="230" y2="120" stroke="#1C1C2B" stroke-width="1" />
      <line x1="125" y1="32" x2="265" y2="102" stroke="#1C1C2B" stroke-width="1" />
      <line x1="195" y1="32" x2="55" y2="102" stroke="#1C1C2B" stroke-width="1" />
      <line x1="230" y1="50" x2="90" y2="120" stroke="#1C1C2B" stroke-width="1" />
      <line x1="265" y1="67" x2="125" y2="137" stroke="#1C1C2B" stroke-width="1" />

      <!-- Isometric Emerald Pillars -->
      <!-- Pillar 1 -->
      <g transform="translate(70, 58)">
        <polygon points="12,0 24,6 12,12 0,6" fill="#10B981" />
        <polygon points="0,6 12,12 12,32 0,26" fill="#059669" />
        <polygon points="24,6 12,12 12,32 24,26" fill="#047857" />
      </g>
      <!-- Pillar 2 -->
      <g transform="translate(105, 42)">
        <polygon points="12,0 24,6 12,12 0,6" fill="#34D399" />
        <polygon points="0,6 12,12 12,48 0,42" fill="#10B981" />
        <polygon points="24,6 12,12 12,48 24,42" fill="#059669" />
      </g>
      <!-- Pillar 3 -->
      <g transform="translate(138, 52)">
        <polygon points="12,0 24,6 12,12 0,6" fill="#10B981" />
        <polygon points="0,6 12,12 12,38 0,32" fill="#059669" />
        <polygon points="24,6 12,12 12,38 24,32" fill="#047857" />
      </g>
      <!-- Pillar 4 (Tall) -->
      <g transform="translate(172, 30)">
        <polygon points="12,0 24,6 12,12 0,6" fill="#6EE7B7" />
        <polygon points="0,6 12,12 12,62 0,56" fill="#34D399" />
        <polygon points="24,6 12,12 12,62 24,56" fill="#10B981" />
      </g>
      <!-- Pillar 5 -->
      <g transform="translate(205, 48)">
        <polygon points="12,0 24,6 12,12 0,6" fill="#34D399" />
        <polygon points="0,6 12,12 12,44 0,38" fill="#10B981" />
        <polygon points="24,6 12,12 12,44 24,38" fill="#059669" />
      </g>
      <!-- Pillar 6 -->
      <g transform="translate(150, 74)">
        <polygon points="12,0 24,6 12,12 0,6" fill="#34D399" />
        <polygon points="0,6 12,12 12,46 0,40" fill="#10B981" />
        <polygon points="24,6 12,12 12,46 24,40" fill="#059669" />
      </g>
      <!-- Pillar 7 -->
      <g transform="translate(228, 62)">
        <polygon points="12,0 24,6 12,12 0,6" fill="#6EE7B7" />
        <polygon points="0,6 12,12 12,54 0,48" fill="#34D399" />
        <polygon points="24,6 12,12 12,54 24,48" fill="#10B981" />
      </g>
    </g>

    <!-- Stats Column on Right -->
    <g transform="translate(328, 36)" class="sans" font-size="11.5" fill="#A1A1AA">
      <text x="0" y="0" font-weight="700" fill="#FAFAFA">Commit Streaks</text>
      <text x="0" y="20">● Active daily CI &amp; code</text>
      <text x="0" y="38">● Docs-as-Code PRs</text>
      <text x="0" y="70" font-weight="700" fill="#FAFAFA">Timezone</text>
      <text x="0" y="90" class="mono" font-size="10.5" fill="#10B981">America/Sao_Paulo</text>
      <text x="0" y="108" class="mono" font-size="10" fill="#71717A">UTC-03:00 (RJ, BR)</text>
    </g>
  </g>
</svg>
