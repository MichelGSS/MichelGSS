name: Lowlighter Metrics Telemetry

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📊 Overview & 3D Isometric Calendar (lowlighter/metrics)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: America/Sao_Paulo
          base: header, repositories
          base_hireable: yes
          repositories_skipped: MichelGSS/luna-nera
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_lines: yes
          plugin_lines_sections: base
          extras_css: |
            svg {
              background: #0C0C12 !important;
              border: 1.5px solid #262636 !important;
              border-radius: 16px !important;
              color: #D4D4D8 !important;
            }
            .items-wrapper {
              padding: 6px 10px 10px 10px !important;
              box-sizing: border-box !important;
            }
            h1, h2, h3 {
              color: #10B981 !important;
              font-weight: 700 !important;
            }
            h1 svg, h2 svg, h3 svg, .field > svg {
              fill: #10B981 !important;
            }
            b, strong, h1 span {
              color: #FAFAFA !important;
            }
            footer {
              display: none !important;
            }
            [fill="#ebedf0"], [fill="#EBEDF0"] {
              fill: #161622 !important;
            }
            [fill="#9be9a8"], [fill="#9BE9A8"] {
              fill: #065F46 !important;
            }
            [fill="#40c463"], [fill="#40C463"] {
              fill: #059669 !important;
            }
            [fill="#30a14e"], [fill="#30A14E"] {
              fill: #10B981 !important;
            }
            [fill="#216e39"], [fill="#216E39"] {
              fill: #34D399 !important;
            }

      - name: 💻 Languages Breakdown, Diff Volume & Calendar (lowlighter/metrics)
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: America/Sao_Paulo
          base: ""
          repositories_skipped: MichelGSS/luna-nera
          config_order: languages, lines, calendar
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 4
          plugin_calendar: yes
          plugin_calendar_limit: 2
          extras_css: |
            svg {
              background: #0C0C12 !important;
              border: 1.5px solid #262636 !important;
              border-radius: 16px !important;
              color: #D4D4D8 !important;
            }
            .items-wrapper {
              padding: 6px 10px 10px 10px !important;
              box-sizing: border-box !important;
            }
            h1, h2, h3 {
              color: #10B981 !important;
              font-weight: 700 !important;
            }
            h1 svg, h2 svg, h3 svg, .field > svg {
              fill: #10B981 !important;
            }
            b, strong {
              color: #FAFAFA !important;
            }
            .field.language.details small {
              color: #A1A1AA !important;
            }
            .diff-handle {
              color: #FAFAFA !important;
              font-weight: 600 !important;
            }
            .added {
              color: #34D399 !important;
            }
            .diff-box.added {
              background-color: #10B981 !important;
            }
            svg.calendar text {
              fill: #FAFAFA !important;
              font-weight: 700 !important;
            }
            [fill="#ebedf0"], [fill="#EBEDF0"] {
              fill: #161622 !important;
            }
            [fill="#9be9a8"], [fill="#9BE9A8"] {
              fill: #065F46 !important;
            }
            [fill="#40c463"], [fill="#40C463"] {
              fill: #059669 !important;
            }
            [fill="#30a14e"], [fill="#30A14E"] {
              fill: #10B981 !important;
            }
            [fill="#216e39"], [fill="#216E39"] {
              fill: #34D399 !important;
            }
