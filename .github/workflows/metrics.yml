name: Lowlighter Metrics Telemetry

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📊 Overview & Isometric Calendar (lowlighter/metrics)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: America/Sao_Paulo
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_lines: yes
          extras_css: |
            svg {
              background: #0C0C12 !important;
              border: 1px solid #242432 !important;
              border-radius: 16px !important;
              color: #A1A1AA !important;
            }
            h1, h2, h3 {
              color: #10B981 !important;
              font-weight: 700 !important;
            }
            h1 svg, h2 svg, h3 svg, .field svg {
              fill: #10B981 !important;
            }
            b, strong {
              color: #FAFAFA !important;
            }
            :root {
              --color-calendar-graph-day-bg: #161622 !important;
              --color-calendar-graph-day-border: rgba(255, 255, 255, 0.05) !important;
              --color-calendar-graph-day-L1-bg: #064E3B !important;
              --color-calendar-graph-day-L2-bg: #047857 !important;
              --color-calendar-graph-day-L3-bg: #10B981 !important;
              --color-calendar-graph-day-L4-bg: #34D399 !important;
            }

      - name: 💻 In-Depth Languages, Diff Stats & Calendar (lowlighter/metrics)
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: America/Sao_Paulo
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_lines: yes
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 4
          plugin_calendar: yes
          plugin_calendar_limit: 2
          extras_css: |
            svg {
              background: #0C0C12 !important;
              border: 1px solid #242432 !important;
              border-radius: 16px !important;
              color: #A1A1AA !important;
            }
            h1, h2, h3 {
              color: #10B981 !important;
              font-weight: 700 !important;
            }
            h1 svg, h2 svg, h3 svg, .field svg {
              fill: #10B981 !important;
            }
            b, strong {
              color: #FAFAFA !important;
            }
            :root {
              --color-calendar-graph-day-bg: #161622 !important;
              --color-calendar-graph-day-border: rgba(255, 255, 255, 0.05) !important;
              --color-calendar-graph-day-L1-bg: #064E3B !important;
              --color-calendar-graph-day-L2-bg: #047857 !important;
              --color-calendar-graph-day-L3-bg: #10B981 !important;
              --color-calendar-graph-day-L4-bg: #34D399 !important;
            }
