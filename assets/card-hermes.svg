<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0C12" />
      <stop offset="100%" stop-color="#07070A" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Space Grotesk', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>
  <rect width="580" height="280" rx="16" fill="url(#cBg5)" stroke="#242432" stroke-width="1.5" />
  <rect x="1" y="1" width="578" height="4" rx="2" fill="#EAB308" />

  <!-- Top Badge & Metric -->
  <g transform="translate(22, 22)">
    <rect width="234" height="22" rx="6" fill="#EAB308" fill-opacity="0.12" stroke="#EAB308" stroke-opacity="0.4" />
    <circle cx="12" cy="11" r="3.5" fill="#FACC15" />
    <text x="22" y="15" class="mono" font-size="9.5" font-weight="700" fill="#FACC15" letter-spacing="0.8">AUTONOMOUS AI AGENT // CRON</text>
    <rect x="404" y="0" width="132" height="22" rx="6" fill="#14141E" stroke="#2A2A3A" />
    <text x="470" y="15" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#34D399">ZERO-COST CI/CD</text>
  </g>

  <!-- Title & Description -->
  <text x="22" y="68" class="sans" font-size="17" font-weight="700" fill="#FAFAFA">Briefing Diário — Autonomous AI Agent Pipeline</text>
  <text x="22" y="90" class="sans" font-size="11.5" fill="#A1A1AA">Automated daily macro-politics &amp; crypto intelligence briefing synthesized by</text>
  <text x="22" y="106" class="sans" font-size="11.5" fill="#A1A1AA">an open-source Python AI agent and dispatched every morning via GitHub Actions.</text>
  <text x="22" y="122" class="sans" font-size="11.5" fill="#A1A1AA">Self-healing RSS/API ingestion, Gemini LLM synthesis &amp; HTML email delivery.</text>

  <!-- Code / Terminal Preview Box -->
  <g transform="translate(22, 136)">
    <rect width="536" height="92" rx="10" fill="#060609" stroke="#1E1E2A" />
    <text x="14" y="20" class="mono" font-size="10" fill="#FACC15"># .github/workflows/daily-briefing.yml — Scheduled 09:00 UTC</text>
    <text x="14" y="38" class="mono" font-size="10" fill="#A1A1AA">$ python agent/hermes_briefing.py --sources rss,market --deliver smtp</text>
    <text x="14" y="55" class="mono" font-size="10" fill="#34D399">✓ Aggregated 42 feeds | Synthesized executive digest via Gemini API</text>
    <text x="14" y="72" class="mono" font-size="10" fill="#38BDF8">✓ Dispatched HTML newsletter | Serverless runtime cost: R$ 0.00</text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(22, 242)" class="mono" font-size="9.5" fill="#D4D4D8">
    <rect x="0" y="0" width="68" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="34" y="15" text-anchor="middle" fill="#FACC15">Python</text>
    <rect x="76" y="0" width="106" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="129" y="15" text-anchor="middle">GitHub Actions</text>
    <rect x="190" y="0" width="88" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="234" y="15" text-anchor="middle">Gemini API</text>
    <rect x="286" y="0" width="84" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="328" y="15" text-anchor="middle">Hermes Agent</text>
    <rect x="378" y="0" width="74" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="415" y="15" text-anchor="middle">RSS / JSON</text>
    <rect x="460" y="0" width="76" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="498" y="15" text-anchor="middle" fill="#34D399">Cron Ops</text>
  </g>
