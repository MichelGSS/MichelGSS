  </defs>
  <rect width="580" height="280" rx="16" fill="url(#cBg1)" stroke="#242432" stroke-width="1.5" />
  <rect x="1" y="1" width="578" height="4" rx="2" fill="#10B981" />

  <!-- Top Badge & Metric -->
  <g transform="translate(22, 22)">
