  <text x="22" y="106" class="sans" font-size="11.5" fill="#A1A1AA">9 retail ERP modules (POS, Inventory, Finance, Fiscal, Catalog). Engineered with</text>
  <text x="22" y="122" class="sans" font-size="11.5" fill="#A1A1AA">Diátaxis, localized MS Style Guide, Mermaid diagrams &amp; automated CLI linter.</text>

