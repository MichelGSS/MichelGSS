<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060608" />
      <stop offset="50%" stop-color="#0C0C12" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>
    <linearGradient id="emeraldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.025" />
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Space Grotesk', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .display { font-family: 'Syne', 'Space Grotesk', sans-serif; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bgGrad2)" />
  <rect width="1200" height="320" rx="18" fill="url(#grid2)" />
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#22222A" stroke-width="1.5" />

  <!-- Top Header Bar -->
  <text x="36" y="34" class="mono" font-size="11" font-weight="700" fill="#10B981" letter-spacing="2">01 // DOCUMENTATION ARCHITECTURE &amp; AUTOMATED QUALITY PIPELINE</text>
  <text x="1164" y="34" text-anchor="end" class="mono" font-size="10" fill="#71717A" letter-spacing="1.5">DIÁTAXIS + MS STYLE GUIDE + GIT CI/CD</text>
