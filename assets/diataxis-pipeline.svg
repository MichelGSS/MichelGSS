    <text x="12" y="43" class="sans" font-size="11.8" fill="#D4D4D8">Source-verified field tables, OpenAPI</text>
    <text x="12" y="60" class="sans" font-size="11.8" fill="#D4D4D8">3.1 schemas, HTTP status codes &amp; SQL</text>
    <text x="12" y="77" class="sans" font-size="11.8" fill="#D4D4D8">models validated on live endpoints.</text>
  </g>

  <!-- Q4: Explanation -->
  <g transform="translate(310, 196)">
    <rect width="262" height="98" rx="12" fill="#0E0E16" stroke="#2A2A3A" stroke-width="1.2" />
    <rect x="12" y="13" width="8" height="8" rx="2" fill="#A78BFA" />
    <text x="26" y="21" class="mono" font-size="11.2" font-weight="700" fill="#FAFAFA">04. EXPLANATION</text>
    <text x="248" y="21" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#A78BFA">ARCHITECTURE</text>
    <text x="12" y="43" class="sans" font-size="11.8" fill="#D4D4D8">Architectural deep-dives and Mermaid</text>
    <text x="12" y="60" class="sans" font-size="11.8" fill="#D4D4D8">flowcharts clarifying how POS, stock,</text>
    <text x="12" y="77" class="sans" font-size="11.8" fill="#D4D4D8">finance, or OCR pipelines connect.</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="596" y1="60" x2="596" y2="298" stroke="#262636" stroke-width="1" stroke-dasharray="4 4" />

