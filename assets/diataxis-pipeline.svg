<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 324" width="1200" height="324">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060608" />
      <stop offset="50%" stop-color="#0C0C12" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.028" />
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Space Grotesk', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="324" rx="18" fill="url(#bgGrad2)" />
  <rect width="1200" height="324" rx="18" fill="url(#grid2)" />
  <rect x="1" y="1" width="1198" height="322" rx="17" fill="none" stroke="#242432" stroke-width="1.5" />

  <!-- Top Header Bar -->
  <text x="36" y="34" class="mono" font-size="11" font-weight="700" fill="#10B981" letter-spacing="2">01 // DOCUMENTATION ARCHITECTURE &amp; AUTOMATED QUALITY PIPELINE</text>
  <text x="1164" y="34" text-anchor="end" class="mono" font-size="10.5" fill="#A1A1AA" letter-spacing="1.5">DIÁTAXIS + MS STYLE GUIDE + GIT CI/CD</text>
  <line x1="36" y1="46" x2="1164" y2="46" stroke="#242432" stroke-width="1" />

  <!-- LEFT HALF: 4-Quadrant Diátaxis Matrix -->
  <text x="36" y="72" class="sans" font-size="14.5" font-weight="700" fill="#FAFAFA">Diátaxis 4-Quadrant Information Architecture</text>
  <text x="572" y="72" text-anchor="end" class="mono" font-size="10.5" fill="#10B981">// One clear job per page</text>

  <!-- Q1: Tutorials -->
  <g transform="translate(36, 86)">
    <rect width="262" height="98" rx="12" fill="#0E0E16" stroke="#2A2A3A" stroke-width="1.2" />
    <rect x="12" y="13" width="8" height="8" rx="2" fill="#10B981" />
    <text x="26" y="21" class="mono" font-size="11.2" font-weight="700" fill="#FAFAFA">01. TUTORIALS</text>
    <text x="248" y="21" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#10B981">LEARNING</text>
    <text x="12" y="43" class="sans" font-size="11.8" fill="#D4D4D8">Guided onboarding lessons taking new</text>
    <text x="12" y="60" class="sans" font-size="11.8" fill="#D4D4D8">users &amp; developers through their first</text>
    <text x="12" y="77" class="sans" font-size="11.8" fill="#D4D4D8">complete workflow step by step.</text>
  </g>

  <!-- Q2: How-To Guides -->
  <g transform="translate(310, 86)">
    <rect width="262" height="98" rx="12" fill="#0E0E16" stroke="#2A2A3A" stroke-width="1.2" />
    <rect x="12" y="13" width="8" height="8" rx="2" fill="#34D399" />
    <text x="26" y="21" class="mono" font-size="11.2" font-weight="700" fill="#FAFAFA">02. HOW-TO GUIDES</text>
    <text x="248" y="21" text-anchor="end" class="mono" font-size="9.5" font-weight="600" fill="#34D399">TASK-DRIVEN</text>
    <text x="12" y="43" class="sans" font-size="11.8" fill="#D4D4D8">Actionable recipes solving real-world</text>
    <text x="12" y="60" class="sans" font-size="11.8" fill="#D4D4D8">tasks — from ERP NFe/NFCe fiscal flows</text>
    <text x="12" y="77" class="sans" font-size="11.8" fill="#D4D4D8">to webhook auth &amp; pre-publish checks.</text>
  </g>

