    <text x="12" y="42" class="sans" font-size="11.5" fill="#A1A1AA">Source-verified field tables, OpenAPI</text>
    <text x="12" y="58" class="sans" font-size="11.5" fill="#A1A1AA">3.1 schemas, HTTP status codes &amp; SQL</text>
    <text x="12" y="74" class="sans" font-size="11.5" fill="#A1A1AA">models tested against live endpoints.</text>
  </g>

  <!-- Q4: Explanation -->
