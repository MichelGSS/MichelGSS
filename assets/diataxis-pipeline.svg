  <text x="620" y="72" class="sans" font-size="14.5" font-weight="700" fill="#FAFAFA">Docs-as-Code &amp; Automated Quality Pipeline</text>
  <text x="1164" y="72" text-anchor="end" class="mono" font-size="10.5" fill="#10B981">// Zero drift</text>

  <!-- Step 1 -->
  <g transform="translate(620, 86)">
    <rect width="544" height="45" rx="10" fill="#0E0E16" stroke="#2A2A3A" stroke-width="1.2" />
    <rect x="10" y="8.5" width="44" height="28" rx="6" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-opacity="0.45" />
    <text x="32" y="26.5" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#10B981">01</text>
    <text x="66" y="20" class="sans" font-size="12.2" font-weight="700" fill="#FAFAFA">System &amp; Source Code Inspection</text>
    <text x="66" y="36" class="mono" font-size="10.8" fill="#D4D4D8">Read JS/TS/Python/Rust source, query SQL &amp; exercise live REST APIs in Postman</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(620, 139)">
    <rect width="544" height="45" rx="10" fill="#0E0E16" stroke="#2A2A3A" stroke-width="1.2" />
    <rect x="10" y="8.5" width="44" height="28" rx="6" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-opacity="0.45" />
    <text x="32" y="26.5" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#10B981">02</text>
    <text x="66" y="20" class="sans" font-size="12.2" font-weight="700" fill="#FAFAFA">Diátaxis &amp; MDX 3 Engineering</text>
    <text x="66" y="36" class="mono" font-size="10.8" fill="#D4D4D8">Author Docusaurus 3 portals, Mermaid.js flowcharts &amp; SnapKit annotated captures</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(620, 192)">
    <rect width="544" height="45" rx="10" fill="#0E0E16" stroke="#2A2A3A" stroke-width="1.2" />
    <rect x="10" y="8.5" width="44" height="28" rx="6" fill="#38BDF8" fill-opacity="0.16" stroke="#38BDF8" stroke-opacity="0.45" />
    <text x="32" y="26.5" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#38BDF8">03</text>
    <text x="66" y="20" class="sans" font-size="12.2" font-weight="700" fill="#FAFAFA">Automated Style &amp; Link Verification</text>
    <text x="66" y="36" class="mono" font-size="10.8" fill="#D4D4D8">Run custom Node/Python linters (Microsoft Style Guide, frontmatter, orphan check)</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(620, 245)">
    <rect width="544" height="49" rx="10" fill="#0D1914" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.55" />
    <rect x="10" y="10.5" width="44" height="28" rx="6" fill="#10B981" />
    <text x="32" y="28.5" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#060608">04</text>
    <text x="66" y="21" class="sans" font-size="12.2" font-weight="700" fill="#FAFAFA">Git CI/CD &amp; Lighthouse 100 Deployment</text>
    <text x="66" y="38" class="mono" font-size="10.8" font-weight="600" fill="#34D399">Continuous deployment scoring 100/100 in Accessibility, Best Practices &amp; SEO</text>
