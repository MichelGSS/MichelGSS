    <rect x="10" y="8" width="44" height="28" rx="6" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.4" />
    <text x="32" y="26" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#10B981">01</text>
    <text x="66" y="20" class="sans" font-size="12" font-weight="700" fill="#FAFAFA">System &amp; Source Code Inspection</text>
    <text x="66" y="35" class="mono" font-size="10.5" fill="#A1A1AA">Read JS/TS/Python/Rust source, query SQL &amp; exercise live REST APIs in Postman</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(620, 138)">
    <rect width="544" height="44" rx="10" fill="#0E0E15" stroke="#272734" stroke-width="1" />
    <rect x="10" y="8" width="44" height="28" rx="6" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.4" />
    <text x="32" y="26" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#10B981">02</text>
    <text x="66" y="20" class="sans" font-size="12" font-weight="700" fill="#FAFAFA">Diátaxis &amp; MDX 3 Engineering</text>
    <text x="66" y="35" class="mono" font-size="10.5" fill="#A1A1AA">Author Docusaurus 3 portals, Mermaid.js flowcharts &amp; SnapKit annotated captures</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(620, 190)">
    <rect width="544" height="44" rx="10" fill="#0E0E15" stroke="#272734" stroke-width="1" />
    <rect x="10" y="8" width="44" height="28" rx="6" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.4" />
    <text x="32" y="26" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#38BDF8">03</text>
    <text x="66" y="20" class="sans" font-size="12" font-weight="700" fill="#FAFAFA">Automated Style &amp; Link Verification</text>
    <text x="66" y="35" class="mono" font-size="10.5" fill="#A1A1AA">Run custom Node/Python linters (Microsoft Style Guide, frontmatter, orphan check)</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(620, 242)">
    <rect width="544" height="48" rx="10" fill="#0E1915" stroke="#10B981" stroke-width="1" stroke-opacity="0.5" />
    <rect x="10" y="10" width="44" height="28" rx="6" fill="#10B981" />
    <text x="32" y="28" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#060608">04</text>
    <text x="66" y="21" class="sans" font-size="12" font-weight="700" fill="#FAFAFA">Git CI/CD &amp; Lighthouse 100 Deployment</text>
    <text x="66" y="37" class="mono" font-size="10.5" fill="#34D399">Continuous deployment scoring 100/100 in Accessibility, Best Practices &amp; SEO</text>
