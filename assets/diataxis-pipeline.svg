    <text x="12" y="42" class="sans" font-size="11.5" fill="#A1A1AA">Architectural deep-dives and Mermaid</text>
    <text x="12" y="58" class="sans" font-size="11.5" fill="#A1A1AA">flowcharts clarifying how POS, stock,</text>
    <text x="12" y="74" class="sans" font-size="11.5" fill="#A1A1AA">finance, or OCR pipelines connect.</text>
  </g>

