  <text x="365" y="72" class="mono" font-size="10.5" fill="#71717A">// Every page has one clear job</text>

  <!-- Q1: Tutorials -->
  <g transform="translate(36, 86)">
    <rect width="262" height="96" rx="12" fill="#0E0E15" stroke="#272734" stroke-width="1" />
    <rect x="12" y="12" width="8" height="8" rx="2" fill="#10B981" />
    <text x="26" y="20" class="mono" font-size="11" font-weight="700" fill="#FAFAFA">01. TUTORIALS</text>
    <text x="248" y="20" text-anchor="end" class="mono" font-size="9.5" fill="#10B981">LEARNING</text>
    <text x="12" y="42" class="sans" font-size="11.5" fill="#A1A1AA">Guided onboarding lessons taking new</text>
    <text x="12" y="58" class="sans" font-size="11.5" fill="#A1A1AA">developers through their first complete</text>
    <text x="12" y="74" class="sans" font-size="11.5" fill="#A1A1AA">working integration step by step.</text>
  </g>

  <!-- Q2: How-To Guides -->
  <g transform="translate(310, 86)">
    <rect width="262" height="96" rx="12" fill="#0E0E15" stroke="#272734" stroke-width="1" />
    <rect x="12" y="12" width="8" height="8" rx="2" fill="#34D399" />
    <text x="26" y="20" class="mono" font-size="11" font-weight="700" fill="#FAFAFA">02. HOW-TO GUIDES</text>
    <text x="248" y="20" text-anchor="end" class="mono" font-size="9.5" fill="#34D399">TASK-DRIVEN</text>
    <text x="12" y="42" class="sans" font-size="11.5" fill="#A1A1AA">Actionable recipes solving real-world</text>
    <text x="12" y="58" class="sans" font-size="11.5" fill="#A1A1AA">workflows — from ERP fiscal emission</text>
    <text x="12" y="74" class="sans" font-size="11.5" fill="#A1A1AA">to webhook verification &amp; CI checks.</text>
  </g>

