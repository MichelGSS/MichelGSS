<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0C12" />
      <stop offset="100%" stop-color="#07070A" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Space Grotesk', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>
  <rect width="580" height="280" rx="16" fill="url(#cBg4)" stroke="#242432" stroke-width="1.5" />
  <rect x="1" y="1" width="578" height="4" rx="2" fill="#A78BFA" />

  <!-- Top Badge & Metric -->
  <g transform="translate(22, 22)">
    <rect width="234" height="22" rx="6" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.4" />
    <circle cx="12" cy="11" r="3.5" fill="#A78BFA" />
    <text x="22" y="15" class="mono" font-size="9.5" font-weight="700" fill="#C4B5FD" letter-spacing="0.8">FRONTEND ARCHITECTURE // MOTION</text>
    <rect x="404" y="0" width="132" height="22" rx="6" fill="#14141E" stroke="#2A2A3A" />
    <text x="470" y="15" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#C4B5FD">EN/PT · ⌘K STUDIO</text>
  </g>

  <!-- Title & Description -->
  <text x="22" y="68" class="sans" font-size="17" font-weight="700" fill="#FAFAFA">MICHEL.DEV — Interactive Portfolio &amp; DX Studio</text>
  <text x="22" y="90" class="sans" font-size="11.5" fill="#A1A1AA">Terminal-meets-editorial React 18 application engineered with Vite, Tailwind CSS</text>
  <text x="22" y="106" class="sans" font-size="11.5" fill="#A1A1AA">&amp; Framer Motion. Features a dual-mode 3D Identity HUD / Live CLI emulator,</text>
  <text x="22" y="122" class="sans" font-size="11.5" fill="#A1A1AA">interactive Diátaxis explorer, ⌘K command palette, and real-time theme engine.</text>

  <!-- Code / Terminal Preview Box -->
  <g transform="translate(22, 136)">
    <rect width="536" height="92" rx="10" fill="#060609" stroke="#1E1E2A" />
    <text x="14" y="20" class="mono" font-size="10" fill="#71717A">// Bilingual Context + 60fps Spring Physics + Interactive CLI</text>
    <text x="14" y="38" class="mono" font-size="10" fill="#C4B5FD">const <tspan fill="#FAFAFA">{ lang, accent, setCommandOpen } = useLanguage();</tspan></text>
    <text x="14" y="55" class="mono" font-size="10" fill="#A1A1AA">&lt;<tspan fill="#38BDF8">InteractiveTerminal</tspan> kernel=<tspan fill="#34D399">"DX-STUDIO v2.6"</tspan> mode=<tspan fill="#34D399">"hud | cli"</tspan> /&gt;</text>
    <text x="14" y="72" class="mono" font-size="10" fill="#10B981">✓ 5 Studio Accent Themes | Verified MEC Diploma &amp; 12 Certs Explorer</text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(22, 242)" class="mono" font-size="9.5" fill="#D4D4D8">
    <rect x="0" y="0" width="74" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="37" y="15" text-anchor="middle">React 18</text>
    <rect x="82" y="0" width="92" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="128" y="15" text-anchor="middle">Tailwind CSS</text>
    <rect x="182" y="0" width="100" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="232" y="15" text-anchor="middle">Framer Motion</text>
    <rect x="290" y="0" width="56" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="318" y="15" text-anchor="middle">Vite</text>
    <rect x="354" y="0" width="86" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="397" y="15" text-anchor="middle">i18n Engine</text>
    <rect x="448" y="0" width="88" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="492" y="15" text-anchor="middle" fill="#C4B5FD">Live CLI</text>
  </g>
