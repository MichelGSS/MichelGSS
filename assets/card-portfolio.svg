<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 284" width="580" height="284">
  <defs>
    <linearGradient id="cBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D14" />
      <stop offset="100%" stop-color="#07070B" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Space Grotesk', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>
  <rect width="580" height="284" rx="16" fill="url(#cBg4)" stroke="#262636" stroke-width="1.5" />
  <rect x="1" y="1" width="578" height="4" rx="2" fill="#A78BFA" />

  <!-- Top Badge & Metric -->
  <g transform="translate(22, 22)">
    <rect width="238" height="23" rx="6" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.45" />
    <circle cx="12" cy="11.5" r="3.5" fill="#A78BFA" />
    <text x="22" y="15.5" class="mono" font-size="9.8" font-weight="700" fill="#C4B5FD" letter-spacing="0.8">FRONTEND ARCHITECTURE // MOTION</text>
    <rect x="402" y="0" width="134" height="23" rx="6" fill="#141420" stroke="#2C2C3E" />
    <text x="469" y="15.5" text-anchor="middle" class="mono" font-size="9.8" font-weight="700" fill="#C4B5FD">EN/PT · ⌘K STUDIO</text>
  </g>

  <!-- Title & Description -->
  <text x="22" y="68" class="sans" font-size="17.5" font-weight="700" fill="#FAFAFA">MICHEL.DEV — Interactive Portfolio &amp; DX Studio</text>
  <text x="22" y="90" class="sans" font-size="11.8" fill="#D4D4D8">Terminal-meets-editorial React 18 application engineered with Vite, Tailwind CSS</text>
  <text x="22" y="106.5" class="sans" font-size="11.8" fill="#D4D4D8">&amp; Framer Motion. Features a dual-mode 3D Identity HUD / Live CLI emulator,</text>
  <text x="22" y="123" class="sans" font-size="11.8" fill="#D4D4D8">interactive Diátaxis explorer, ⌘K command palette, and real-time theme engine.</text>

  <!-- Code / Terminal Preview Box -->
  <g transform="translate(22, 138)">
    <rect width="536" height="92" rx="10" fill="#060609" stroke="#222230" />
    <text x="14" y="21" class="mono" font-size="10.3" fill="#A1A1AA">// Bilingual Context + 60fps Spring Physics + Interactive CLI</text>
    <text x="14" y="39" class="mono" font-size="10.4" fill="#C4B5FD">const <tspan fill="#FAFAFA">{ lang, accent, setCommandOpen } = useLanguage();</tspan></text>
    <text x="14" y="56.5" class="mono" font-size="10.3" fill="#D4D4D8">&lt;<tspan fill="#38BDF8">InteractiveTerminal</tspan> kernel=<tspan fill="#34D399">"DX-STUDIO v2.6"</tspan> mode=<tspan fill="#34D399">"hud | cli"</tspan> /&gt;</text>
    <text x="14" y="74" class="mono" font-size="10.3" fill="#34D399">✓ 5 Studio Accent Themes | Verified MEC Diploma &amp; 12 Certs Explorer</text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(22, 245)" class="mono" font-size="9.8" fill="#E4E4E7">
    <rect x="0" y="0" width="74" height="23" rx="6" fill="#14141F" stroke="#2A2A3A" />
    <text x="37" y="15.5" text-anchor="middle">React 18</text>
    <rect x="82" y="0" width="92" height="23" rx="6" fill="#14141F" stroke="#2A2A3A" />
    <text x="128" y="15.5" text-anchor="middle">Tailwind CSS</text>
    <rect x="182" y="0" width="100" height="23" rx="6" fill="#14141F" stroke="#2A2A3A" />
    <text x="232" y="15.5" text-anchor="middle">Framer Motion</text>
    <rect x="290" y="0" width="56" height="23" rx="6" fill="#14141F" stroke="#2A2A3A" />
    <text x="318" y="15.5" text-anchor="middle">Vite</text>
    <rect x="354" y="0" width="86" height="23" rx="6" fill="#14141F" stroke="#2A2A3A" />
    <text x="397" y="15.5" text-anchor="middle">i18n Engine</text>
    <rect x="448" y="0" width="88" height="23" rx="6" fill="#14141F" stroke="#2A2A3A" />
    <text x="492" y="15.5" text-anchor="middle" fill="#C4B5FD" font-weight="600">Live CLI</text>
