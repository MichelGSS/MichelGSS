<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0C12" />
      <stop offset="100%" stop-color="#07070A" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Space Grotesk', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>
  <rect width="580" height="280" rx="16" fill="url(#cBg2)" stroke="#242432" stroke-width="1.5" />
  <rect x="1" y="1" width="578" height="4" rx="2" fill="#F97316" />

  <!-- Top Badge & Metric -->
  <g transform="translate(22, 22)">
    <rect width="232" height="22" rx="6" fill="#F97316" fill-opacity="0.12" stroke="#F97316" stroke-opacity="0.4" />
    <circle cx="12" cy="11" r="3.5" fill="#F97316" />
    <text x="22" y="15" class="mono" font-size="9.5" font-weight="700" fill="#FB923C" letter-spacing="0.8">OPEN SOURCE NATIVE APP // RUST</text>
    <rect x="412" y="0" width="124" height="22" rx="6" fill="#14141E" stroke="#2A2A3A" />
    <text x="474" y="15" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#34D399">100% LOCAL · MIT</text>
  </g>

  <!-- Title & Description -->
  <text x="22" y="68" class="sans" font-size="17" font-weight="700" fill="#FAFAFA">SnapKit — Screen Capture, OCR &amp; Step Recorder</text>
  <text x="22" y="90" class="sans" font-size="11.5" fill="#A1A1AA">Native Windows screen capture &amp; documentation recorder written in Rust.</text>
  <text x="22" y="106" class="sans" font-size="11.5" fill="#A1A1AA">Features step-by-step click recording into numbered shots, 19 annotation tools</text>
  <text x="22" y="122" class="sans" font-size="11.5" fill="#A1A1AA">(API key blur, callouts), scrolling capture, neural ONNX PaddleOCR &amp; FFmpeg.</text>

  <!-- Code / Terminal Preview Box -->
  <g transform="translate(22, 136)">
    <rect width="536" height="92" rx="10" fill="#060609" stroke="#1E1E2A" />
    <text x="14" y="20" class="mono" font-size="10" fill="#71717A">// SnapKit — Native Rust Architecture (src/steps.rs &amp; src/editor.rs)</text>
    <text x="14" y="38" class="mono" font-size="10" fill="#FB923C">pub struct <tspan fill="#FAFAFA">StepCaptureSession</tspan> {</text>
    <text x="14" y="55" class="mono" font-size="10" fill="#A1A1AA">  pub steps: <tspan fill="#34D399">Vec&lt;NumberedStep&gt;</tspan>,  pub ocr: <tspan fill="#38BDF8">NeuralOcrRuntime</tspan>,</text>
    <text x="14" y="72" class="mono" font-size="10" fill="#A1A1AA">} <tspan fill="#10B981">// ~100 MB idle RAM | Zero cloud telemetry | Diátaxis EN/PT Docs</tspan></text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(22, 242)" class="mono" font-size="9.5" fill="#D4D4D8">
    <rect x="0" y="0" width="56" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="28" y="15" text-anchor="middle" fill="#FB923C">Rust</text>
    <rect x="64" y="0" width="96" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="112" y="15" text-anchor="middle">egui / tiny-skia</text>
    <rect x="168" y="0" width="112" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="224" y="15" text-anchor="middle">ONNX PaddleOCR</text>
    <rect x="288" y="0" width="76" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="326" y="15" text-anchor="middle">Tesseract</text>
    <rect x="372" y="0" width="66" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="405" y="15" text-anchor="middle">FFmpeg</text>
    <rect x="446" y="0" width="90" height="22" rx="6" fill="#14141D" stroke="#272736" />
    <text x="491" y="15" text-anchor="middle" fill="#10B981">Win32 API</text>
  </g>
</svg>
