<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 284" width="580" height="284">
  <defs>
    <linearGradient id="cBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D14" />
      <stop offset="100%" stop-color="#07070B" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Space Grotesk', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>
  <rect width="580" height="284" rx="16" fill="url(#cBg2)" stroke="#262636" stroke-width="1.5" />
  <rect x="1" y="1" width="578" height="4" rx="2" fill="#F97316" />

  <!-- Top Badge & Metric -->
  <g transform="translate(22, 22)">
    <rect width="236" height="23" rx="6" fill="#F97316" fill-opacity="0.14" stroke="#F97316" stroke-opacity="0.45" />
    <circle cx="12" cy="11.5" r="3.5" fill="#F97316" />
    <text x="22" y="15.5" class="mono" font-size="9.8" font-weight="700" fill="#FB923C" letter-spacing="0.8">OPEN SOURCE NATIVE APP // RUST</text>
    <rect x="410" y="0" width="126" height="23" rx="6" fill="#141420" stroke="#2C2C3E" />
    <text x="473" y="15.5" text-anchor="middle" class="mono" font-size="9.8" font-weight="700" fill="#34D399">100% LOCAL · MIT</text>
  </g>

  <!-- Title & Description -->
  <text x="22" y="68" class="sans" font-size="17.5" font-weight="700" fill="#FAFAFA">SnapKit — Screen Capture, OCR &amp; Step Recorder</text>
  <text x="22" y="90" class="sans" font-size="11.8" fill="#D4D4D8">Native Windows screen capture &amp; documentation recorder written in Rust.</text>
  <text x="22" y="106.5" class="sans" font-size="11.8" fill="#D4D4D8">Features click-to-step guide recording, 19 vector annotation tools (API key</text>
  <text x="22" y="123" class="sans" font-size="11.8" fill="#D4D4D8">blur, callouts), scrolling capture, local ONNX PaddleOCR &amp; FFmpeg encoding.</text>

  <!-- Code / Terminal Preview Box -->
  <g transform="translate(22, 138)">
    <rect width="536" height="92" rx="10" fill="#060609" stroke="#222230" />
    <text x="14" y="21" class="mono" font-size="10.3" fill="#A1A1AA">// SnapKit — Native Rust Architecture (src/steps.rs &amp; src/editor.rs)</text>
    <text x="14" y="39" class="mono" font-size="10.4" fill="#FB923C">pub struct <tspan fill="#FAFAFA" font-weight="700">StepCaptureSession</tspan> {</text>
    <text x="14" y="56.5" class="mono" font-size="10.3" fill="#D4D4D8">  pub steps: <tspan fill="#34D399">Vec&lt;NumberedStep&gt;</tspan>,  pub ocr: <tspan fill="#38BDF8">NeuralOcrRuntime</tspan>,</text>
    <text x="14" y="74" class="mono" font-size="10.3" fill="#D4D4D8">} <tspan fill="#10B981">// ~100 MB idle RAM | Zero cloud telemetry | Diátaxis EN/PT Docs</tspan></text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(22, 245)" class="mono" font-size="9.8" fill="#E4E4E7">
    <rect x="0" y="0" width="56" height="23" rx="6" fill="#14141F" stroke="#2A2A3A" />
    <text x="28" y="15.5" text-anchor="middle" fill="#FB923C" font-weight="700">Rust</text>
    <rect x="64" y="0" width="96" height="23" rx="6" fill="#14141F" stroke="#2A2A3A" />
    <text x="112" y="15.5" text-anchor="middle">egui / tiny-skia</text>
    <rect x="168" y="0" width="112" height="23" rx="6" fill="#14141F" stroke="#2A2A3A" />
    <text x="224" y="15.5" text-anchor="middle">ONNX PaddleOCR</text>
    <rect x="288" y="0" width="76" height="23" rx="6" fill="#14141F" stroke="#2A2A3A" />
    <text x="326" y="15.5" text-anchor="middle">Tesseract</text>
    <rect x="372" y="0" width="66" height="23" rx="6" fill="#14141F" stroke="#2A2A3A" />
    <text x="405" y="15.5" text-anchor="middle">FFmpeg</text>
    <rect x="446" y="0" width="90" height="23" rx="6" fill="#14141F" stroke="#2A2A3A" />
    <text x="491" y="15.5" text-anchor="middle" fill="#34D399" font-weight="600">Win32 API</text>
  </g>
</svg>
