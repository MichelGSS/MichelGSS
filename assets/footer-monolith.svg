<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060608" />
      <stop offset="50%" stop-color="#0D1613" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>
    <linearGradient id="fLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Space Grotesk', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      @keyframes pulseFooter {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .pulse { animation: pulseFooter 2.2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1200" height="110" rx="16" fill="url(#fBg)" stroke="#242432" stroke-width="1.5" />
  <rect x="100" y="0" width="1000" height="2" fill="url(#fLine)" />

  <circle cx="48" cy="40" r="4.5" fill="#10B981" class="pulse" />
  <text x="62" y="44" class="mono" font-size="11" font-weight="700" fill="#10B981" letter-spacing="2">05 // INITIATE TRANSMISSION — AVAILABLE FOR REMOTE GLOBAL ROLES</text>
  <text x="1152" y="44" text-anchor="end" class="mono" font-size="10.5" fill="#A1A1AA" letter-spacing="1.5">MICHEL.DEV // RIO DE JANEIRO, BR (UTC-3)</text>

  <text x="48" y="76" class="sans" font-size="14" fill="#FAFAFA" font-weight="600">
    "Engineering software &amp; designing documentation that developers actually want to read."
  </text>
  <text x="1152" y="76" text-anchor="end" class="mono" font-size="11.2" font-weight="600" fill="#34D399">
    michelgss.github.io/portfolio  ·  michelfixingit@gmail.com
  </text>
