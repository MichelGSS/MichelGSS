<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060608" />
      <stop offset="50%" stop-color="#0B0B10" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="15%" stop-color="#FAFAFA" />
      <stop offset="65%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14141D" />
      <stop offset="100%" stop-color="#0A0A0F" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22222A" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="emeraldOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="archGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03" />
    </pattern>
    <pattern id="dotMatrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06" />
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      .sans { font-family: 'Space Grotesk', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .display { font-family: 'Syne', 'Space Grotesk', 'Arial Black', sans-serif; font-weight: 800; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.45); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanline {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .pulse { animation: pulseDot 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .cursor { animation: blinkCursor 1.1s steps(2, start) infinite; }
    </style>
  </defs>

  <!-- Outer Monolith Frame -->
  <rect width="1200" height="430" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="430" rx="20" fill="url(#archGrid)" />
  <rect x="1" y="1" width="1198" height="428" rx="19" fill="none" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- Ambient Radial Orbs -->
  <circle cx="260" cy="90" r="280" fill="url(#emeraldOrb)" />
  <circle cx="980" cy="310" r="250" fill="url(#cyanOrb)" />

  <!-- Corner HUD Reticle Brackets -->
  <path d="M 18 34 L 18 18 L 34 18" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.7" />
  <path d="M 1166 18 L 1182 18 L 1182 34" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.7" />
  <path d="M 18 396 L 18 412 L 34 412" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.7" />
  <path d="M 1166 412 L 1182 412 L 1182 396" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.7" />

  <!-- Top Telemetry Coordinates Bar -->
  <text x="44" y="32" class="mono" font-size="10" fill="#71717A" letter-spacing="2.5">SYS.NODE // 22.9068° S, 43.1729° W — RIO DE JANEIRO, BR (UTC-3)</text>
  <text x="1156" y="32" text-anchor="end" class="mono" font-size="10" fill="#10B981" letter-spacing="2">MICHEL.DEV // DX-STUDIO KERNEL v2.6.0</text>
  <line x1="44" y1="42" x2="1156" y2="42" stroke="#22222A" stroke-width="1" />

  <!-- LEFT COLUMN: Identity & Kinetic Typography -->
  <!-- Availability Pill -->
  <g transform="translate(44, 58)">
    <rect width="530" height="28" rx="14" fill="#12121A" stroke="#272732" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#10B981" class="pulse" />
    <circle cx="16" cy="14" r="3" fill="#34D399" />
    <text x="30" y="18" class="mono" font-size="10.5" font-weight="600" fill="#FAFAFA" letter-spacing="1">FULL STACK DEVELOPER &amp; DOCUMENTATION ENGINEER // DX</text>
    <text x="408" y="18" class="mono" font-size="10" fill="#10B981">• REMOTE GLOBAL</text>
  </g>

  <!-- Greeting Line -->
  <g transform="translate(44, 114)">
    <line x1="0" y1="-4" x2="24" y2="-4" stroke="#10B981" stroke-width="2" />
    <text x="32" y="0" class="mono" font-size="12" fill="#A1A1AA" letter-spacing="2.5">HELLO, I'M</text>
    <text x="132" y="1" class="serif" font-size="18" fill="#10B981">Code Author &amp; Spec Architect</text>
  </g>

  <!-- Monumental Name -->
  <text x="42" y="172" class="display" font-size="56" fill="#FAFAFA" letter-spacing="-1">MICHEL</text>
  <text x="292" y="172" class="display" font-size="56" fill="url(#nameGrad)" letter-spacing="-1">SILVEIRA.</text>

  <!-- Role Terminal Pill -->
  <g transform="translate(44, 190)">
    <rect width="610" height="34" rx="8" fill="#0E0E15" stroke="#22222A" stroke-width="1" />
    <text x="14" y="21" class="mono" font-size="12.5" font-weight="700" fill="#10B981">&gt;_</text>
    <text x="40" y="21" class="mono" font-size="12" fill="#FAFAFA">MERN + Python + Rust  |  Docusaurus 3 &amp; Diátaxis  |  OpenAPI 3.1</text>
    <rect x="524" y="10" width="7" height="14" fill="#10B981" class="cursor" />
  </g>

  <!-- Editorial Quote -->
  <g transform="translate(44, 240)">
    <line x1="0" y1="2" x2="0" y2="48" stroke="#10B981" stroke-width="2.5" />
    <text x="14" y="17" class="sans" font-size="13.5" fill="#E4E4E7">
      I build web and native applications in <tspan fill="#10B981" font-weight="600">JavaScript, TypeScript, Python &amp; Rust</tspan>,
    </text>
    <text x="14" y="36" class="sans" font-size="13.5" fill="#A1A1AA">
      and engineer the enterprise documentation portals, style linters &amp; DX tooling behind them.
    </text>
  </g>

  <!-- RIGHT COLUMN: Live CLI Monolith Window -->
  <g transform="translate(684, 58)">
    <rect width="472" height="238" rx="14" fill="url(#cardGrad)" stroke="#2A2A38" stroke-width="1.2" />
    <!-- Window Header -->
    <rect width="472" height="32" rx="14" fill="#09090D" />
    <rect y="18" width="472" height="14" fill="#09090D" />
    <line x1="0" y1="32" x2="472" y2="32" stroke="#22222A" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#F43F5E" fill-opacity="0.85" />
    <circle cx="32" cy="16" r="4.5" fill="#FBBF24" fill-opacity="0.85" />
    <circle cx="46" cy="16" r="4.5" fill="#10B981" fill-opacity="0.85" />
    <text x="64" y="20" class="mono" font-size="11" fill="#A1A1AA">michel@dx-studio:~</text>
    <text x="456" y="20" text-anchor="end" class="mono" font-size="9.5" fill="#10B981" letter-spacing="1">[BASH // LIVE]</text>

    <!-- Terminal Body -->
    <g transform="translate(16, 52)" class="mono" font-size="11">
      <text x="0" y="0" fill="#10B981" font-weight="700">➜ <tspan fill="#38BDF8">~</tspan> <tspan fill="#FAFAFA">whoami --verbose</tspan></text>
      <text x="10" y="18" fill="#A1A1AA">→ Documentation Engineer @ <tspan fill="#FAFAFA" font-weight="600">Total Control Technology</tspan></text>
      <text x="10" y="34" fill="#A1A1AA">→ Technical Writer &amp; Full Stack @ <tspan fill="#FAFAFA" font-weight="600">AWRIT</tspan> (Prev. Editora Globo)</text>
      <text x="10" y="50" fill="#A1A1AA">→ Creator of <tspan fill="#34D399" font-weight="600">SnapKit</tspan> (Native Rust Screen Capture &amp; OCR)</text>

      <text x="0" y="76" fill="#10B981" font-weight="700">➜ <tspan fill="#38BDF8">~</tspan> <tspan fill="#FAFAFA">npm run verificar &amp;&amp; npm run build</tspan></text>
      <text x="10" y="94" fill="#34D399">✓ Diátaxis + MS Style Guide validated across 9 ERP modules</text>
      <text x="10" y="110" fill="#34D399">✓ 0 broken MDX links | 0 orphan pages | Frontmatter 100%</text>
      <text x="10" y="126" fill="#38BDF8">✓ Lighthouse Audit: A11y 100 · Best Practices 100 · SEO 100</text>

      <text x="0" y="152" fill="#10B981" font-weight="700">➜ <tspan fill="#38BDF8">~</tspan> <tspan fill="#FAFAFA">echo $APPROACH</tspan></text>
      <text x="10" y="168" fill="#E4E4E7" font-style="italic">"If it isn't documented &amp; source-verified, it doesn't exist."</text>
      <rect x="415" y="157" width="6" height="13" fill="#10B981" class="cursor" />
    </g>
  </g>

  <!-- BOTTOM 4-COLUMN TELEMETRY STRIP (Matches Portfolio Hero Metrics) -->
  <!-- Card 1 -->
  <g transform="translate(44, 316)">
    <rect width="266" height="78" rx="12" fill="#0E0E15" stroke="#22222A" stroke-width="1" />
    <rect x="224" y="14" width="28" height="28" rx="7" fill="#14141F" stroke="#10B981" stroke-opacity="0.35" />
    <text x="238" y="32" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#10B981">★</text>
    <text x="16" y="34" class="display" font-size="26" fill="#10B981">100/100</text>
    <text x="16" y="53" class="sans" font-size="12" font-weight="700" fill="#FAFAFA">Lighthouse DX Score</text>
    <text x="16" y="68" class="mono" font-size="10" fill="#71717A">Accessibility, SEO &amp; Best Practices</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(326, 316)">
    <rect width="266" height="78" rx="12" fill="#0E0E15" stroke="#22222A" stroke-width="1" />
    <rect x="224" y="14" width="28" height="28" rx="7" fill="#14141F" stroke="#10B981" stroke-opacity="0.35" />
    <text x="238" y="32" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#10B981">&lt;/&gt;</text>
    <text x="16" y="34" class="display" font-size="26" fill="#FAFAFA">MERN + Rust</text>
    <text x="16" y="53" class="sans" font-size="12" font-weight="700" fill="#FAFAFA">Full Stack &amp; Native Apps</text>
    <text x="16" y="68" class="mono" font-size="10" fill="#71717A">JS, TS, Python, Rust, React, SQL</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(608, 316)">
    <rect width="266" height="78" rx="12" fill="#0E0E15" stroke="#22222A" stroke-width="1" />
    <rect x="224" y="14" width="28" height="28" rx="7" fill="#14141F" stroke="#10B981" stroke-opacity="0.35" />
    <text x="238" y="32" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#10B981">§</text>
    <text x="16" y="34" class="display" font-size="26" fill="#FAFAFA">Diátaxis</text>
    <text x="16" y="53" class="sans" font-size="12" font-weight="700" fill="#FAFAFA">Docs-as-Code Architecture</text>
    <text x="16" y="68" class="mono" font-size="10" fill="#71717A">Docusaurus 3, MDX, OpenAPI, Linter</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(890, 316)">
    <rect width="266" height="78" rx="12" fill="#0E0E15" stroke="#22222A" stroke-width="1" />
    <rect x="224" y="14" width="28" height="28" rx="7" fill="#14141F" stroke="#10B981" stroke-opacity="0.35" />
    <text x="238" y="32" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#38BDF8">C1</text>
    <text x="16" y="34" class="display" font-size="26" fill="#38BDF8">C1 + CS50x</text>
    <text x="16" y="53" class="sans" font-size="12" font-weight="700" fill="#FAFAFA">Verified Credentials</text>
    <text x="16" y="68" class="mono" font-size="10" fill="#71717A">IBMR Degree · Harvard · W3C · EF SET</text>
  </g>
</svg>
