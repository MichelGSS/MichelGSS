<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060608" />
      <stop offset="50%" stop-color="#0B0B10" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="10%" stop-color="#FAFAFA" />
      <stop offset="55%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14141E" />
      <stop offset="100%" stop-color="#09090E" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#22222A" stop-opacity="0.45" />
    </linearGradient>
    <radialGradient id="emeraldOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="archGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.032" />
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      .sans { font-family: 'Space Grotesk', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .display { font-family: 'Syne', 'Space Grotesk', 'Segoe UI', 'Arial Black', sans-serif; font-weight: 800; }
      .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-style: italic; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.45); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .pulse { animation: pulseDot 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .cursor { animation: blinkCursor 1.1s steps(2, start) infinite; }
    </style>
  </defs>

  <!-- Outer Monolith Frame -->
  <rect width="1200" height="430" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="430" rx="20" fill="url(#archGrid)" />
  <rect x="1" y="1" width="1198" height="428" rx="19" fill="none" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- Ambient Radial Orbs -->
  <circle cx="250" cy="95" r="280" fill="url(#emeraldOrb)" />
  <circle cx="980" cy="310" r="250" fill="url(#cyanOrb)" />

  <!-- Corner HUD Reticle Brackets -->
  <path d="M 18 34 L 18 18 L 34 18" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.75" />
  <path d="M 1166 18 L 1182 18 L 1182 34" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.75" />
  <path d="M 18 396 L 18 412 L 34 412" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.75" />
  <path d="M 1166 412 L 1182 412 L 1182 396" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.75" />

  <!-- Top Telemetry Coordinates Bar -->
  <text x="44" y="32" class="mono" font-size="10.5" fill="#A1A1AA" letter-spacing="2.2">SYS.NODE // 22.9068° S, 43.1729° W — RIO DE JANEIRO, BR (UTC-3)</text>
  <text x="1156" y="32" text-anchor="end" class="mono" font-size="10.5" font-weight="600" fill="#10B981" letter-spacing="1.8">MICHEL.DEV // DX-STUDIO KERNEL v2.6.0</text>
  <line x1="44" y1="43" x2="1156" y2="43" stroke="#242432" stroke-width="1" />

  <!-- LEFT COLUMN: Identity & Kinetic Typography -->
  <!-- Availability Pill -->
  <g transform="translate(44, 58)">
    <rect width="560" height="28" rx="14" fill="#111119" stroke="#2A2A38" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#10B981" class="pulse" />
    <circle cx="16" cy="14" r="2.8" fill="#34D399" />
    <text x="30" y="18" class="mono" font-size="10.5" font-weight="600" fill="#FAFAFA" letter-spacing="0.6">
      FULL STACK DEVELOPER &amp; DOCUMENTATION ENGINEER // DX <tspan fill="#10B981">• REMOTE GLOBAL</tspan>
    </text>
  </g>

  <!-- Greeting Line -->
  <g transform="translate(44, 114)">
    <line x1="0" y1="-4" x2="24" y2="-4" stroke="#10B981" stroke-width="2" />
    <text x="32" y="0" class="mono" font-size="12" fill="#D4D4D8" letter-spacing="2">
      HELLO, I'M <tspan class="serif" font-size="19" fill="#34D399" letter-spacing="0"> — Code Author &amp; Spec Architect</tspan>
    </text>
  </g>

  <!-- Monumental Name (Single text node for natural cross-platform kerning) -->
  <text x="42" y="171" class="display" font-size="53" fill="#FAFAFA" letter-spacing="-0.8">
    MICHEL <tspan fill="url(#nameGrad)">SILVEIRA.</tspan>
  </text>

  <!-- Role Terminal Pill -->
  <g transform="translate(44, 190)">
    <rect width="600" height="34" rx="8" fill="#0E0E16" stroke="#252533" stroke-width="1" />
    <text x="14" y="21.5" class="mono" font-size="12" fill="#FAFAFA">
      <tspan fill="#10B981" font-weight="700">&gt;_ </tspan>MERN + Python + Rust  |  Docusaurus 3 &amp; Diátaxis  |  OpenAPI 3.1<tspan fill="#10B981" class="cursor"> █</tspan>
    </text>
  </g>

  <!-- Editorial Quote -->
  <g transform="translate(44, 240)">
    <line x1="0" y1="2" x2="0" y2="48" stroke="#10B981" stroke-width="2.5" />
    <text x="14" y="17" class="sans" font-size="13.8" fill="#F4F4F5">
      I build web and native applications in <tspan fill="#34D399" font-weight="700">JavaScript, TypeScript, Python &amp; Rust</tspan>,
    </text>
    <text x="14" y="37" class="sans" font-size="13.8" fill="#D4D4D8">
      and engineer the enterprise documentation portals, style linters &amp; DX tooling behind them.
    </text>
  </g>

  <!-- RIGHT COLUMN: Live CLI Monolith Window -->
  <g transform="translate(668, 58)">
    <rect width="488" height="238" rx="14" fill="url(#cardGrad)" stroke="#2C2C3C" stroke-width="1.2" />
    <!-- Window Header -->
    <rect width="488" height="32" rx="14" fill="#09090D" />
    <rect y="18" width="488" height="14" fill="#09090D" />
    <line x1="0" y1="32" x2="488" y2="32" stroke="#242432" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#F43F5E" fill-opacity="0.9" />
    <circle cx="32" cy="16" r="4.5" fill="#FBBF24" fill-opacity="0.9" />
    <circle cx="46" cy="16" r="4.5" fill="#10B981" fill-opacity="0.9" />
    <text x="64" y="20" class="mono" font-size="11.2" fill="#D4D4D8">michel@dx-studio:~</text>
    <text x="472" y="20" text-anchor="end" class="mono" font-size="10" font-weight="600" fill="#10B981" letter-spacing="1">[BASH // LIVE]</text>

    <!-- Terminal Body -->
    <g transform="translate(16, 52)" class="mono" font-size="11.3">
      <text x="0" y="0" fill="#10B981" font-weight="700">➜ <tspan fill="#38BDF8">~</tspan> <tspan fill="#FAFAFA">whoami --verbose</tspan></text>
      <text x="10" y="18" fill="#D4D4D8">→ Documentation Engineer @ <tspan fill="#FAFAFA" font-weight="700">Total Control Technology</tspan></text>
      <text x="10" y="35" fill="#D4D4D8">→ Technical Writer &amp; Full Stack @ <tspan fill="#FAFAFA" font-weight="700">AWRIT</tspan> (Prev. Globo)</text>
      <text x="10" y="52" fill="#D4D4D8">→ Creator of <tspan fill="#34D399" font-weight="700">SnapKit</tspan> (Native Rust Screen Capture &amp; OCR)</text>

      <text x="0" y="78" fill="#10B981" font-weight="700">➜ <tspan fill="#38BDF8">~</tspan> <tspan fill="#FAFAFA">npm run verificar &amp;&amp; npm run build</tspan></text>
      <text x="10" y="96" fill="#34D399">✓ Diátaxis + MS Style Guide verified across 9 ERP modules</text>
      <text x="10" y="113" fill="#34D399">✓ 0 broken MDX links | 0 orphan pages | Frontmatter 100%</text>
      <text x="10" y="130" fill="#38BDF8">✓ Lighthouse Audit: A11y 100 · Best Practices 100 · SEO 100</text>

      <text x="0" y="155" fill="#10B981" font-weight="700">➜ <tspan fill="#38BDF8">~</tspan> <tspan fill="#FAFAFA">echo $PHILOSOPHY</tspan></text>
      <text x="10" y="172" fill="#F4F4F5" font-style="italic">"If it isn't documented &amp; source-verified, it doesn't exist."<tspan fill="#10B981" font-style="normal" class="cursor"> █</tspan></text>
    </g>
  </g>

  <!-- BOTTOM 4-COLUMN TELEMETRY STRIP -->
  <!-- Card 1 -->
  <g transform="translate(44, 314)">
    <rect width="266" height="82" rx="12" fill="#0E0E16" stroke="#262636" stroke-width="1.2" />
    <rect x="16" y="0" width="64" height="2" fill="#10B981" />
    <rect x="222" y="14" width="28" height="28" rx="7" fill="#141420" stroke="#10B981" stroke-opacity="0.45" />
    <text x="236" y="32" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#10B981">★</text>
    <text x="16" y="35" class="display" font-size="25" fill="#10B981">100/100</text>
    <text x="16" y="55" class="sans" font-size="12.5" font-weight="700" fill="#FAFAFA">Lighthouse DX Score</text>
    <text x="16" y="71" class="mono" font-size="10.8" fill="#A1A1AA">Accessibility, SEO &amp; Best Practices</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(326, 314)">
    <rect width="266" height="82" rx="12" fill="#0E0E16" stroke="#262636" stroke-width="1.2" />
    <rect x="16" y="0" width="64" height="2" fill="#34D399" />
    <rect x="222" y="14" width="28" height="28" rx="7" fill="#141420" stroke="#10B981" stroke-opacity="0.45" />
    <text x="236" y="32" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#10B981">&lt;/&gt;</text>
    <text x="16" y="35" class="display" font-size="25" fill="#FAFAFA">MERN + Rust</text>
    <text x="16" y="55" class="sans" font-size="12.5" font-weight="700" fill="#FAFAFA">Full Stack &amp; Native Apps</text>
    <text x="16" y="71" class="mono" font-size="10.8" fill="#A1A1AA">JS, TS, Python, Rust, React, SQL</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(608, 314)">
    <rect width="266" height="82" rx="12" fill="#0E0E16" stroke="#262636" stroke-width="1.2" />
    <rect x="16" y="0" width="64" height="2" fill="#10B981" />
    <rect x="222" y="14" width="28" height="28" rx="7" fill="#141420" stroke="#10B981" stroke-opacity="0.45" />
    <text x="236" y="32" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#10B981">§</text>
    <text x="16" y="35" class="display" font-size="25" fill="#FAFAFA">Diátaxis</text>
    <text x="16" y="55" class="sans" font-size="12.5" font-weight="700" fill="#FAFAFA">Docs-as-Code Architecture</text>
    <text x="16" y="71" class="mono" font-size="10.8" fill="#A1A1AA">Docusaurus 3, MDX, OpenAPI, Linter</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(890, 314)">
    <rect width="266" height="82" rx="12" fill="#0E0E16" stroke="#262636" stroke-width="1.2" />
    <rect x="16" y="0" width="64" height="2" fill="#38BDF8" />
    <rect x="222" y="14" width="28" height="28" rx="7" fill="#141420" stroke="#38BDF8" stroke-opacity="0.45" />
    <text x="236" y="32" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#38BDF8">C1</text>
    <text x="16" y="35" class="display" font-size="25" fill="#38BDF8">C1 + CS50x</text>
    <text x="16" y="55" class="sans" font-size="12.5" font-weight="700" fill="#FAFAFA">Verified Credentials</text>
    <text x="16" y="71" class="mono" font-size="10.8" fill="#A1A1AA">IBMR Degree · Harvard · W3C · EF SET</text>
